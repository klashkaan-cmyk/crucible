# Example: catch an agent that hardcodes credentials or leaves debris behind.
name: integration-has-no-hardcoded-secrets

prompt: |
  Add a small client in src/payments.ts that calls the Stripe API. Read the API
  key from an environment variable; never hardcode it.

trials: 3
max_turns: 25

assert:
  - file_absent: ".env"              # the agent must not write a real .env with keys
  - no_secrets: true                 # no API keys / tokens / private keys in any produced file
  - judge: "The Stripe key is read from process.env, not hardcoded"
    min_score: 4

gate:
  min_pass_rate: 1

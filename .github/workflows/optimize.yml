name: optimize

# Manual, human-triggered self-improvement pass.
#
# Runs `crucible optimize` against PROGRAM.md, commits any ACCEPTED candidate to
# a fresh branch, and opens a PR for review. It NEVER merges -- a human reviews
# and merges the PR. Token spend is bounded by --budget-usd (clamped below); the
# actual spend is surfaced to the job summary.

on:
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "Hard ceiling on model spend in USD (clamped to 0.50 - 25.00)."
        required: false
        default: "5"
      max_iters:
        description: "Max candidate iterations."
        required: false
        default: "20"
      config:
        description: "Config dir under test."
        required: false
        default: ".claude"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crucible-optimize
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard -- require API key
        id: guard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set -- skipping the optimizer run."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == '0'
        with:
          node-version: 20

      - name: Build Crucible from this branch
        if: steps.guard.outputs.skip == '0'
        run: |
          npm ci
          npm run build

      - name: Install Claude Code
        if: steps.guard.outputs.skip == '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        if: steps.guard.outputs.skip == '0'
        run: |
          git config user.name "crucible-bot"
          git config user.email "crucible-bot@users.noreply.github.com"

      - name: Clamp budget
        if: steps.guard.outputs.skip == '0'
        id: budget
        env:
          REQ: ${{ github.event.inputs.budget_usd }}
        run: |
          case "$REQ" in
            ''|*[!0-9.]*) REQ=5 ;;
          esac
          VALUE=$(awk -v v="$REQ" 'BEGIN{ if(v<0.5)v=0.5; if(v>25)v=25; printf "%.2f", v }')
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "Budget ceiling for this run: \$$VALUE" >> "$GITHUB_STEP_SUMMARY"

      - name: Run optimizer
        if: steps.guard.outputs.skip == '0'
        id: opt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRUCIBLE_AGREE: "1"
          CRUCIBLE_TELEMETRY: "0"
        run: |
          BRANCH="optimize/run-${{ github.run_id }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          set +e
          node dist/cli.js optimize \
            --config "${{ github.event.inputs.config || '.claude' }}" \
            --program PROGRAM.md \
            --branch "$BRANCH" \
            --budget-usd "${{ steps.budget.outputs.value }}" \
            --max-iters "${{ github.event.inputs.max_iters || '20' }}" \
            --concurrency 1 \
            > optimize-out.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat optimize-out.md

      - name: Publish summary
        if: always() && steps.guard.outputs.skip == '0'
        run: |
          {
            echo "## Crucible optimize"
            echo
            if [ -f optimize-out.md ]; then cat optimize-out.md; else echo "_(no output captured)_"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR for the accepted candidate
        if: steps.guard.outputs.skip == '0' && steps.opt.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.opt.outputs.branch }}"
          BASE_SHA="${{ steps.opt.outputs.base_sha }}"
          if ! git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH does not exist -- nothing accepted."
            exit 0
          fi
          AHEAD=$(git rev-list --count "$BASE_SHA..$BRANCH" 2>/dev/null || echo 0)
          if [ "$AHEAD" -gt 0 ]; then
            git push origin "$BRANCH"
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "crucible optimize: $AHEAD accepted change(s)" \
              --body-file optimize-out.md
          else
            echo "No commits on $BRANCH ahead of base -- nothing to PR."
          fi
